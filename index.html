<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Files.md</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="menubar" role="menubar">
      <div class="menu" data-menu="file">
        <button class="menu-button" aria-haspopup="true">File</button>
        <div class="menu-list" role="menu">
          <button data-action="open">Open…<kbd>Ctrl+O</kbd></button>
          <div class="submenu">
            <button class="submenu-button">Open recent<span class="chev">›</span></button>
            <div class="menu-list" id="recent-list" role="menu"></div>
          </div>
          <hr />
          <button data-action="reload">Reload<kbd>F5</kbd></button>
          <button data-action="copy-path">Copy file path</button>
          <hr />
          <button data-action="quit">Exit<kbd>Ctrl+Q</kbd></button>
        </div>
      </div>
      <div class="menu" data-menu="view">
        <button class="menu-button" aria-haspopup="true">View</button>
        <div class="menu-list" role="menu">
          <button data-action="toggle-toc">Headings pane<kbd>Ctrl+B</kbd></button>
          <button data-action="toggle-prefs">Preferences<kbd>Ctrl+,</kbd></button>
          <hr />
          <button data-action="theme:light">Light theme</button>
          <button data-action="theme:dark">Dark theme</button>
          <button data-action="theme:system">Match Windows</button>
          <hr />
          <button data-action="zoom-in">Larger text<kbd>Ctrl+=</kbd></button>
          <button data-action="zoom-out">Smaller text<kbd>Ctrl+-</kbd></button>
          <button data-action="zoom-reset">Reset text size<kbd>Ctrl+0</kbd></button>
        </div>
      </div>
      <div class="menu" data-menu="help">
        <button class="menu-button" aria-haspopup="true">Help</button>
        <div class="menu-list" role="menu">
          <button data-action="shortcuts">Keyboard shortcuts</button>
          <button data-action="set-default">Make default for .md files…</button>
          <button data-action="about">About Files.md</button>
        </div>
      </div>
      <div class="menubar-title" id="doc-title">Files.md</div>
      <div class="menubar-tools">
        <button class="icon-btn" data-action="toggle-toc" title="Headings pane (Ctrl+B)" aria-label="Toggle headings pane">
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 4h14M3 8h9M3 12h11M3 16h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="icon-btn" data-action="toggle-prefs" title="Preferences (Ctrl+,)" aria-label="Preferences">
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M4 5h7M15 5h1M4 10h2M10 10h6M4 15h9M17 15h-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="13" cy="5" r="2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="8" cy="10" r="2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="15" cy="15" r="2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <nav class="toc" id="toc" aria-label="Headings">
        <div class="toc-header">
          <span>Headings</span>
          <input type="search" id="toc-filter" placeholder="Filter" aria-label="Filter headings" />
        </div>
        <ol id="toc-list"></ol>
        <p class="toc-empty" id="toc-empty">No headings</p>
      </nav>
      <div class="toc-resizer" id="toc-resizer" aria-hidden="true"></div>

      <main class="content" id="content" tabindex="-1">
        <article class="markdown-body" id="doc"></article>
        <section class="welcome" id="welcome">
          <h1>Files.md</h1>
          <p>Open a Markdown file to start reading.</p>
          <button class="primary" data-action="open">Open file…</button>
          <p class="hint">or drop a <code>.md</code> file anywhere on this window</p>
        </section>
      </main>

      <aside class="prefs" id="prefs" aria-label="Preferences">
        <div class="prefs-header">
          <h2>Preferences</h2>
          <button class="icon-btn" data-action="toggle-prefs" aria-label="Close preferences">✕</button>
        </div>
        <label class="field">
          <span>Theme</span>
          <div class="segmented" data-pref="theme">
            <button value="light">Light</button><button value="dark">Dark</button><button value="system">System</button>
          </div>
        </label>
        <label class="field">
          <span>Font</span>
          <select data-pref="font">
            <option value="sans">Sans-serif</option>
            <option value="serif">Serif</option>
            <option value="mono">Monospace</option>
          </select>
        </label>
        <label class="field">
          <span>Text size <output id="fontSize-out"></output></span>
          <input type="range" min="12" max="24" step="1" data-pref="fontSize" />
        </label>
        <label class="field">
          <span>Line spacing <output id="lineHeight-out"></output></span>
          <input type="range" min="1.3" max="2" step="0.05" data-pref="lineHeight" />
        </label>
        <label class="field">
          <span>Page width</span>
          <div class="segmented" data-pref="width">
            <button value="narrow">Narrow</button><button value="medium">Medium</button><button value="wide">Wide</button><button value="full">Full</button>
          </div>
        </label>
        <label class="check"><input type="checkbox" data-pref="showToc" /> Show headings pane</label>
        <label class="check"><input type="checkbox" data-pref="tocNumbers" /> Number headings in pane</label>
        <label class="check"><input type="checkbox" data-pref="wrapCode" /> Wrap long code lines</label>
        <label class="check"><input type="checkbox" data-pref="autoReload" /> Reload when the file changes</label>
        <button class="link-btn" data-action="reset-prefs">Reset to defaults</button>
        <p class="prefs-note" id="prefs-note"></p>
      </aside>
    </div>

    <div class="drop-overlay" id="drop-overlay"><div>Drop to open</div></div>
    <div class="toast" id="toast" role="status"></div>

    <dialog id="dialog">
      <div id="dialog-body"></div>
      <form method="dialog"><button class="primary">OK</button></form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
