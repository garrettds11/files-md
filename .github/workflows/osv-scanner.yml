
name: OSV Dependency Security

on:
  push:
    branches:
      - main

permissions:
  contents: read

  pull_request:
    branches:
      - main

  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:

  # Full repository vulnerability assessment
  scan-full:
    name: Full Dependency Scan

    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0

    with:
      scan-args: |-
        --recursive
        ./

      upload-sarif: true

      # Report vulnerabilities without failing the job.
      fail-on-vuln: false

  # Identify vulnerabilities introduced by a PR
  scan-pr:
    name: Pull Request Dependency Scan

    if: github.event_name == 'pull_request'

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0

    with:
      scan-args: |-
        --recursive
        ./

      upload-sarif: true

      # Initially report rather than enforce.
      fail-on-vuln: false
