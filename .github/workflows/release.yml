name: Release

# Releases are driven by the version in src-tauri/tauri.conf.json.
# On every push to main, if release v<version> doesn't exist yet, this builds
# files-md.exe, creates the v<version> tag, and publishes the release.
# Pushing a v* tag yourself also works. Manual runs (Actions tab) do the same check.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build and publish $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # --no-bundle: build just the portable .exe (no installer).
      - run: npx tauri build --no-bundle

      - name: Collect exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/files-md.exe out/files-md.exe
          (Get-FileHash out/files-md.exe -Algorithm SHA256).Hash + "  files-md.exe" | Out-File -Encoding ascii out/files-md.exe.sha256

      - uses: actions/upload-artifact@v4
        id: upload-unsigned
        with:
          name: files-md-unsigned
          path: out/files-md.exe

      # ---------------------------------------------------------------
      # Code signing via SignPath Foundation (enable after approval).
      # 1. Add repo secret SIGNPATH_API_TOKEN and variable SIGNPATH_ORGANIZATION_ID.
      # 2. Uncomment the step below and set the project/policy slugs SignPath gives you.
      # 3. Change the release step to publish the signed exe from out-signed/.
      # ---------------------------------------------------------------
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: files-md
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: out-signed

      - name: Publish release (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        shell: pwsh
        run: |
          gh release create "$env:TAG" out/files-md.exe out/files-md.exe.sha256 `
            --target "${{ github.sha }}" --title "Files.md $env:TAG" --generate-notes `
            --notes "Download ``files-md.exe`` below. It's portable: no installer, just run it.`n`nCode signing NOT YET provided by SignPath.io, certificate by SignPath Foundation.`nThis app code is running UNSIGNED code for now!`n"
