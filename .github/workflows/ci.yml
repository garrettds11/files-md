name: CI

# Build and test on Windows for every branch other than main (main is built by Release).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: ../.github/scripts/run-and-annotate.sh cargo test --color never

      - name: Build exe
        shell: bash
        run: .github/scripts/run-and-annotate.sh npx tauri build --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: files-md-${{ github.ref_name }}-unsigned
          path: src-tauri/target/release/files-md.exe
