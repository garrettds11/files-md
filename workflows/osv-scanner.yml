
name: OSV Dependency Scan

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/osv-scanner.yml"

  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/osv-scanner.yml"

  schedule:
    - cron: "0 9 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/google/osv-scanner/main/install.sh \
            -o install-osv.sh

          sh install-osv.sh
          osv-scanner --version

      - name: Scan npm and Cargo dependencies
        run: |
          osv-scanner scan source \
            --lockfile=package-lock.json \
            --lockfile=src-tauri/Cargo.lock
        continue-on-error: true
